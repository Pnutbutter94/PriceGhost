version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: priceghost-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-priceghost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-priceghost}
      POSTGRES_DB: ${POSTGRES_DB:-priceghost}
    volumes:
      - /opt/casaserver/data/priceghost/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-priceghost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/clucraft/priceghost-backend:latest
    container_name: priceghost-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-priceghost}:${POSTGRES_PASSWORD:-priceghost}@postgres:5432/${POSTGRES_DB:-priceghost}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /opt/chrome/chrome
    user: root
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    shm_size: 512mb
    volumes:
      - /opt/casaserver/data/priceghost/chrome:/opt/chrome:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/clucraft/priceghost-frontend:latest
    container_name: priceghost-frontend
    ports:
      - "8092:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
